name: Package skill

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build and test skill ZIP
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        # On release events, checkout uses the commit tagged by the release.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.10'

      - name: Build skill ZIP
        run: |
          git archive --format=zip --prefix=athlete-meal-plan/ \
            --output="$RUNNER_TEMP/athlete-meal-plan.zip" HEAD \
            SKILL.md README.md requirements.txt scripts assets references tests evals

      - name: Extract skill ZIP
        run: |
          python -m zipfile -t "$RUNNER_TEMP/athlete-meal-plan.zip"
          python -m zipfile -e "$RUNNER_TEMP/athlete-meal-plan.zip" "$RUNNER_TEMP/skill-package"

      - name: Install dependencies and test packaged skill
        working-directory: ${{ runner.temp }}/skill-package/athlete-meal-plan
        run: |
          python -m pip install -r requirements.txt
          python -m unittest discover tests

      - name: Upload tested skill ZIP
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: skill-package
          path: ${{ runner.temp }}/athlete-meal-plan.zip
          if-no-files-found: error
          compression-level: 0

  publish:
    name: Attach ZIP to release
    if: github.event_name == 'release' && github.event.action == 'published'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download tested skill ZIP
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: skill-package
          path: dist

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$RELEASE_TAG" dist/athlete-meal-plan.zip \
            --repo "$GITHUB_REPOSITORY" --clobber
